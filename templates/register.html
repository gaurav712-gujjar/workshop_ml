<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Register — Sanjeevani Clinic</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="site-header">
    <a href="/" class="brand">
      <span class="brand-mark">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M12 21s-7.5-4.6-9.8-9.4C.6 7.9 2.4 4.5 6 4.1c2-.2 3.6.9 6 3 2.4-2.1 4-3.2 6-3 3.6.4 5.4 3.8 3.8 7.5C19.5 16.4 12 21 12 21z" fill="#F6F3EC"/>
        </svg>
      </span>
      Sanjeevani Clinic
    </a>
  </header>

  <main class="form-shell">
    <div class="eyebrow-block">
      <h1>Create your account</h1>
      <p class="sub">Sign up to book screenings and chat with our assistant</p>
    </div>

    <div class="card">
      {% if error %}
        <p style="color:#8C3D24; margin-bottom:16px;">{{ error }}</p>
      {% endif %}
      <form method="post" action="/register">
        <div class="field full">
          <label>Full name</label>
          <input type="text" name="name" required />
        </div>
        <div class="field full">
          <label>Email</label>
          <input type="email" name="email" required />
        </div>
        <div class="field full">
          <label>Password</label>
          <input type="password" name="password" required minlength="6" />
        </div>
        <div class="submit-row">
          <button type="submit">Create account</button>
        </div>
      </form>
      <p style="text-align:center; margin-top:18px; font-size:0.9rem; color:var(--ink-soft);">
        Already have an account? <a href="/login" style="color:var(--teal-700); font-weight:600;">Log in</a>
      </p>
    </div>
  </main>

  <footer class="site-footer">
    Sanjeevani Screening Clinic — this tool assists triage, it does not replace medical diagnosis.
  </footer>
</body>
</html>
