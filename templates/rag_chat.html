<script>
const messagesEl = document.getElementById("rag-messages");
const inputEl = document.getElementById("rag-input");
const sendBtn = document.getElementById("rag-send");
const formEl = document.getElementById("rag-input-row");

function scrollDown() { messagesEl.scrollTop = messagesEl.scrollHeight; }

function addUser(text) {
    const div = document.createElement("div");
    div.className = "msg user";
    div.textContent = text;
    messagesEl.appendChild(div);
    scrollDown();
}

function addBot(text, { sources = [], chunks = [], error = false } = {}) {
    const div = document.createElement("div");
    div.className = "msg bot" + (error ? " error" : "");
    div.innerHTML = DOMPurify.sanitize(marked.parse(text));

    if (sources.length) {
        const wrap = document.createElement("div");
        wrap.className = "sources";
        sources.forEach(s => {
            const chip = document.createElement("span");
            chip.className = "source-chip";
            chip.textContent = "📄 " + s.replace(/\.md$/, "").replace(/_/g, " ");
            wrap.appendChild(chip);
        });
        div.appendChild(wrap);
    }

    if (chunks.length) {
        const details = document.createElement("details");
        details.className = "passages";
        const summary = document.createElement("summary");
        summary.textContent = `View ${chunks.length} retrieved passage${chunks.length > 1 ? "s" : ""}`;
        details.appendChild(summary);
        chunks.forEach(c => {
            const p = document.createElement("div");
            p.className = "passage";
            const meta = document.createElement("div");
            meta.className = "meta";
            meta.textContent = `${c.source} · match ${c.score}`;
            const body = document.createElement("div");
            body.textContent = c.text;
            p.append(meta, body);
            details.appendChild(p);
        });
        div.appendChild(details);
    }

    messagesEl.appendChild(div);
    scrollDown();
    return div;
}

async function ask(question) {
    question = question.trim();
    if (!question) return;

    addUser(question);
    inputEl.value = "";
    sendBtn.disabled = true;
    inputEl.disabled = true;
    document.getElementById("suggestions").style.display = "none";

    const loading = addBot("Searching clinic guidance…");

    try {
        const res = await fetch("/rag/api", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ question })
        });
        const data = await res.json();
        loading.remove();

        if (!res.ok) {
            addBot(data.error || "Something went wrong.", { error: true });
        } else {
            addBot(data.answer, { sources: data.sources, chunks: data.chunks });
        }
    } catch (err) {
        loading.remove();
        addBot("Network error. Please check your connection and try again.", { error: true });
    } finally {
        sendBtn.disabled = false;
        inputEl.disabled = false;
        inputEl.focus();
    }
}

formEl.addEventListener("submit", e => { e.preventDefault(); ask(inputEl.value); });
document.querySelectorAll("#suggestions button").forEach(b =>
    b.addEventListener("click", () => ask(b.textContent))
);

addBot("Hi! Ask me anything about home care, isolation, testing and recovery, or when to see a doctor.");
</script>
