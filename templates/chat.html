<!DOCTYPE html>
<html>
<head>
    <title>Chat — Sanjeevani Clinic</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.2/marked.min.js"></script>
    <style>
        .chat-page {
            max-width: 640px;
            margin: 0 auto;
            padding: 40px 24px 60px;
        }

        .chat-shell {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: var(--radius-lg);
            overflow: hidden;
        }

        .chat-header {
            background: var(--teal-700);
            color: var(--paper);
            padding: 20px 24px;
            font-family: 'Fraunces', serif;
            font-size: 1.15rem;
            font-weight: 600;
        }

        .chat-header .sub {
            font-family: 'Inter', sans-serif;
            font-weight: 400;
            font-size: 0.82rem;
            color: var(--sage-100);
            margin-top: 4px;
        }

        #messages {
            height: 440px;
            overflow-y: auto;
            padding: 20px;
            background: var(--sage-100);
            display: flex;
            flex-direction: column;
        }

        .msg {
            margin: 6px 0;
            padding: 12px 16px;
            border-radius: 16px;
            max-width: 80%;
            line-height: 1.55;
            font-size: 0.95rem;
        }

        .user {
            background: var(--teal-700);
            color: var(--paper);
            align-self: flex-end;
            border-bottom-right-radius: 4px;
            white-space: pre-wrap;
        }

        .bot {
            background: var(--panel);
            color: var(--ink);
            align-self: flex-start;
            border: 1px solid var(--line);
            border-bottom-left-radius: 4px;
        }

        .bot p { margin: 0 0 10px; }
        .bot p:last-child { margin-bottom: 0; }
        .bot ul, .bot ol { margin: 8px 0; padding-left: 20px; }
        .bot li { margin-bottom: 6px; }
        .bot strong { color: var(--teal-900); }

        .book-suggestion {
            margin-top: 10px;
            display: inline-block;
            background: var(--teal-700);
            color: var(--paper);
            padding: 10px 18px;
            border-radius: 999px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
        }
        .book-suggestion:hover { background: var(--teal-900); }

        #input-row {
            display: flex;
            align-items: center;
            border-top: 1px solid var(--line);
            background: var(--panel);
        }

        .upload-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 100%;
            cursor: pointer;
            font-size: 1.2rem;
            color: var(--teal-700);
        }
        .upload-btn:hover { color: var(--teal-900); }

        #user-input {
            flex: 1;
            padding: 16px;
            border: none;
            outline: none;
            font-family: inherit;
            font-size: 0.95rem;
            color: var(--ink);
            background: transparent;
        }

        #send-btn {
            padding: 0 26px;
            border: none;
            background: var(--teal-700);
            color: var(--paper);
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: background 0.15s ease;
        }

        #send-btn:hover { background: var(--teal-900); }

        .back-link {
            display: inline-block;
            margin-bottom: 18px;
            font-size: 0.88rem;
            color: var(--teal-700);
            text-decoration: none;
            font-weight: 500;
        }
        .back-link:hover { color: var(--teal-900); }
    </style>
</head>
<body>

  <header class="site-header">
    <a href="/" class="brand">
      <span class="brand-mark">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M12 21s-7.5-4.6-9.8-9.4C.6 7.9 2.4 4.5 6 4.1c2-.2 3.6.9 6 3 2.4-2.1 4-3.2 6-3 3.6.4 5.4 3.8 3.8 7.5C19.5 16.4 12 21 12 21z" fill="#F6F3EC"/>
        </svg>
      </span>
      Sanjeevani Clinic
    </a>
  </header>

  <main class="chat-page">
    <a href="/" class="back-link">← Back to home</a>

    <div class="chat-shell">
      <div class="chat-header">
        Clinic Assistant
        <div class="sub">General guidance only — not a substitute for a doctor's visit</div>
      </div>
      <div id="messages"></div>
      <div id="input-row">
        <label for="photo-upload" class="upload-btn" title="Upload injury photo">📷</label>
        <input type="file" id="photo-upload" accept="image/*" style="display:none;" />
        <input id="user-input" type="text" placeholder="Type your message..." />
        <button id="send-btn">Send</button>
      </div>
    </div>
  </main>

<script>
const messagesEl = document.getElementById("messages");
const inputEl = document.getElementById("user-input");
let history = [];

function addMsg(text, cls, specialist = null) {
    const div = document.createElement("div");
    div.className = "msg " + cls;
    if (cls === "bot") {
        div.innerHTML = marked.parse(text);
        if (specialist) {
            const displaySpecialist = specialist === "OPD" ? "General Physician" : specialist;
            const btn = document.createElement("a");
            btn.href = `/book?specialization=${encodeURIComponent(displaySpecialist)}`;
            btn.className = "book-suggestion";
            btn.textContent = `📅 Book appointment with ${displaySpecialist}`;
            div.appendChild(btn);
        }
    } else {
        div.textContent = text;
    }
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
}

async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;
    addMsg(text, "user");
    inputEl.value = "";

    const res = await fetch("/chat/api", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text, history })
    });
    const data = await res.json();
    addMsg(data.reply, "bot", data.specialist);

    history.push({ role: "user", content: text });
    history.push({ role: "assistant", content: data.reply });
}

document.getElementById("send-btn").addEventListener("click", sendMessage);
inputEl.addEventListener("keypress", e => { if (e.key === "Enter") sendMessage(); });

document.getElementById("photo-upload").addEventListener("change", async (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const previewUrl = URL.createObjectURL(file);
    const imgDiv = document.createElement("div");
    imgDiv.className = "msg user";
    imgDiv.innerHTML = `<img src="${previewUrl}" style="max-width:180px; border-radius:10px; display:block;" />`;
    messagesEl.appendChild(imgDiv);
    messagesEl.scrollTop = messagesEl.scrollHeight;

    const loadingMsg = document.createElement("div");
    loadingMsg.className = "msg bot";
    loadingMsg.textContent = "Analyzing photo...";
    messagesEl.appendChild(loadingMsg);
    messagesEl.scrollTop = messagesEl.scrollHeight;

    const formData = new FormData();
    formData.append("file", file);

    const res = await fetch("/chat/photo", { method: "POST", body: formData });
    const data = await res.json();
    loadingMsg.remove();

    addMsg(data.reply, "bot", data.specialist);

    e.target.value = "";
});

addMsg("Hi{{ ' ' + request.session.get('user_name') if request.session.get('user_name') else '' }}! What symptoms or concerns can I help you with today?", "bot");
</script>
</body>
</html>
